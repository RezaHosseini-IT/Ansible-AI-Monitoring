---
- name: Deploy Prometheus and Grafana
  hosts: monitoring
  become: false
  vars:
    monitoring_dir: "{{ ansible_env.HOME }}/monitoring-stack"
    prometheus_port: 9090
    grafana_port: 3000
    grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
    prometheus_image: "prom/prometheus:v3.5.0"
    grafana_image: "grafana/grafana:12.2.0"
    node_exporter_image: "prom/node-exporter:v1.9.1"
    cadvisor_image: "ghcr.io/google/cadvisor:v0.53.0"
  tasks:
    - name: Check that GRAFANA_ADMIN_PASSWORD is set
      no_log: true
      ansible.builtin.assert:
        that:
          - grafana_admin_password is defined
          - grafana_admin_password | length > 0
        fail_msg: "Set GRAFANA_ADMIN_PASSWORD in the environment before running"

    - name: Create directories
      ansible.builtin.file:
        state: directory
        mode: "0755"
        path: "{{ item }}"
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"
        - "{{ monitoring_dir }}/grafana/provisioning/datasources"
        - "{{ monitoring_dir }}/bin"
        - "{{ monitoring_dir }}/textfile"
        - "{{ monitoring_dir }}/grafana/dashboards"
        - "{{ monitoring_dir }}/grafana/provisioning/dashboards"

    - name: Deploy Prometheus configuration
      ansible.builtin.template:
        src: templates/prometheus.yml.j2
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: "0644"
      register: prometheus_config

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Deploy Grafana datasource configuration
      ansible.builtin.copy:
        src: files/grafana/provisioning/datasources/prometheus.yml
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
        mode: "0644"
      register: grafana_datasource_config

    - name: Deploy Grafana dashboard provider
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/dashboards.yml
        dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboards.yml"
        mode: "0644"
      register: grafana_dashboard_provider

    - name: Generate Grafana dashboard
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/tools/make_dashboard.py"
          - "--out"
          - "{{ monitoring_dir }}/grafana/dashboards/homelab-overview.json"
      register: dashboard_result
      changed_when: dashboard_result.stdout | trim == 'changed'

    - name: Deploy Ollama and GPU exporter script
      ansible.builtin.copy:
        src: files/ollama_gpu_exporter.py
        dest: "{{ monitoring_dir }}/bin/ollama_gpu_exporter.py"
        mode: "0755"

    - name: Write initial Ollama and GPU metrics
      ansible.builtin.command:
        argv:
          - python3
          - "{{ monitoring_dir }}/bin/ollama_gpu_exporter.py"
          - "--out"
          - "{{ monitoring_dir }}/textfile/ollama_gpu.prom"
      changed_when: false

    - name: Schedule Ollama and GPU metrics export
      ansible.builtin.cron:
        name: "monitoring ollama gpu exporter"
        minute: "*"
        job: "/usr/bin/python3 {{ monitoring_dir }}/bin/ollama_gpu_exporter.py --out {{ monitoring_dir }}/textfile/ollama_gpu.prom --loops 4 --interval 15 >/dev/null 2>&1"

    - name: Create .env file
      no_log: true
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/.env"
        mode: "0600"
        content: "GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}\n"

    - name: Deploy monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        state: present

    - name: Restart Prometheus if its config changed
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        services:
          - prometheus
        state: restarted
      when: prometheus_config is changed

    - name: Restart Grafana if the dashboard provider changed
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_dir }}"
        services:
          - grafana
        state: restarted
      when: grafana_dashboard_provider is changed

    - name: Wait for Prometheus to be ready
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
        status_code: 200
      register: prometheus_ready
      retries: 12
      delay: 5
      until: prometheus_ready.status == 200

    - name: Wait for Grafana to be healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/health"
        status_code: 200
      register: grafana_health
      retries: 12
      delay: 5
      until: grafana_health.status == 200

    - name: Wait for all Prometheus targets to be up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/targets"
        return_content: true
      register: prometheus_targets
      retries: 12
      delay: 5
      until: prometheus_targets.json.data.activeTargets | map(attribute='health') | unique | list == ['up']

    - name: Query Grafana datasources
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/datasources"
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: grafana_datasources
      no_log: true

    - name: Assert Prometheus datasource is provisioned
      ansible.builtin.assert:
        that:
          - "'Prometheus' in (grafana_datasources.json | map(attribute='name') | list)"
        success_msg: "Prometheus datasource is provisioned in Grafana"

    - name: Wait for the dashboard to be provisioned
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/search?query=Homelab"
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: grafana_dashboards
      retries: 12
      delay: 5
      until: grafana_dashboards.json | length > 0
      no_log: true

    - name: Assert the Homelab Overview dashboard exists
      ansible.builtin.assert:
        that:
          - "grafana_dashboards.json | selectattr('uid', 'equalto', 'homelab-overview') | list | length == 1"
        success_msg: "Homelab Overview dashboard is provisioned"
